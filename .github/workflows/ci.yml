name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      # --frozen-lockfile so a drifting pnpm-lock.yaml fails here rather
      # than silently resolving different versions than the ones verified.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      # Deterministic scorer over committed SYNTHETIC fixtures. Proves the
      # benchmark is reproducible; it is not evidence of real-lecture accuracy.
      - name: ASR accuracy benchmark (synthetic fixtures)
        run: pnpm asr:benchmark -- --json test-results/asr-benchmark.json --max-wer 0.5

      - name: Upload ASR benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asr-benchmark-synthetic
          path: test-results/asr-benchmark.json
          retention-days: 30

      # Build last: it is the slowest step and the one most likely to be
      # fixed by whatever typecheck or the tests already caught.
      - name: Build
        run: pnpm build

      - name: Install browser for synthetic UI tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Desktop and mobile transcript workflow
        run: pnpm test:e2e

      - name: Upload synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: context-browser-evidence
          path: test-results/
          retention-days: 7
